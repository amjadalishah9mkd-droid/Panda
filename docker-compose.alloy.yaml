services:
  web:
    image: node:22-bookworm
    working_dir: /workspace
    network_mode: host
    environment:
      IS_ALLOY: ${IS_ALLOY:-false}
      VITE_PORT: "3000"
    volumes:
      - .:/workspace
      - panda-node-modules:/workspace/node_modules
    command: bash -lc "npm install --no-audit --no-fund && npm run dev -- --host 0.0.0.0 --port 3000"

volumes:
  panda-node-modules:
